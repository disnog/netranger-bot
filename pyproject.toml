[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netranger-bot"
version = "2.0.0"
description = "Discord bot for the DisNOG server"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Jason R. Rokeach" }
]
dependencies = [
    "discord.py>=2.3.0",
    "ipcalc>=1.99.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "aiosmtplib>=3.0.0",
    "netranger-db @ git+https://github.com/disnog/netranger-db.git@v2dev",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
netranger-bot = "network_ranger.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["network_ranger"]

[tool.hatch.metadata]
allow-direct-references = true
